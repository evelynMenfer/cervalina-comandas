<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17181a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Cervalina Comandas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra de tinta arriba; debajo, el espacio de trabajo en columnas pensado para tablet horizontal (cuentas · carta · ticket) */
:root{
  --paper:#f5f5f0; --surface:#ffffff; --surface-2:#ecece4; --ink:#17181a; --ink-2:#5a5c54; --line:#d9d9ce;
  --olive:#5f7d16; --olive-soft:#e6edd2; --lav:#625a9c; --lav-soft:#e8e6f3;
  --warn:#9a5b00; --warn-soft:#fbecd2; --bad:#b0261d; --bad-soft:#f8e0dd; --ok:#2b7a30; --ok-soft:#ddefde;
  --bar:#17181a; --bar-fg:#f5f5f0; --bar-2:#9b9d92;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#121310; --surface:#1b1c18; --surface-2:#262721; --ink:#ecece3; --ink-2:#a6a89c; --line:#35372f;
  --olive:#a6c75c; --olive-soft:#28321a; --lav:#aaa3de; --lav-soft:#2a283d;
  --warn:#eaa646; --warn-soft:#3a2b12; --bad:#f08b80; --bad-soft:#3c1a17; --ok:#80c683; --ok-soft:#1a2e1b;
  --bar:#0b0c0a; --bar-fg:#ecece3; --bar-2:#8d8f84; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#121310; --surface:#1b1c18; --surface-2:#262721; --ink:#ecece3; --ink-2:#a6a89c; --line:#35372f;
  --olive:#a6c75c; --olive-soft:#28321a; --lav:#aaa3de; --lav-soft:#2a283d;
  --warn:#eaa646; --warn-soft:#3a2b12; --bad:#f08b80; --bad-soft:#3c1a17; --ok:#80c683; --ok-soft:#1a2e1b;
  --bar:#0b0c0a; --bar-fg:#ecece3; --bar-2:#8d8f84; color-scheme:dark }

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.4 var(--body);display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Barra superior */
.top{background:var(--bar);color:var(--bar-fg);display:flex;align-items:center;gap:18px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand i{width:14px;height:14px;border:2px solid var(--olive);transform:rotate(45deg);display:block}
.brand b{font:800 21px/1 var(--display);letter-spacing:.06em}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tab{background:none;border:0;color:var(--bar-2);padding:10px 14px;border-radius:10px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:8px;min-height:44px}
.tab:hover{color:var(--bar-fg)}
.tab.on{color:var(--bar-fg);background:rgba(255,255,255,.08);box-shadow:inset 0 -3px 0 var(--lav)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--lav);color:#fff;font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.badge.bad{background:var(--bad)}
.stat{display:flex;align-items:center;gap:8px;color:var(--bar-2);font-size:13px;flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bar-2)}
.dot.ok{background:#7cc47f}.dot.bad{background:#f08b80}
.clock{font:600 15px var(--body);color:var(--bar-fg);font-variant-numeric:tabular-nums}

main#view{flex:1;min-height:0;overflow:auto;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Botones */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;min-height:46px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.olive{background:var(--olive);color:var(--paper);border-color:var(--olive)}
.btn.lav{background:var(--lav);color:var(--paper);border-color:var(--lav)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--paper)}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.p-warn{background:var(--warn-soft);color:var(--warn)} .p-lav{background:var(--lav-soft);color:var(--lav)}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.p-mute{background:var(--surface-2);color:var(--ink-2)}
.p-pago{background:var(--olive);color:var(--paper)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.empty{color:var(--ink-2);padding:18px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r);margin:0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.toolbar h2{font-size:26px;margin-right:auto}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:9px;font-weight:600;min-height:40px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* Comandas */
.cmd{display:grid;grid-template-columns:230px minmax(0,1fr) 370px;gap:16px;height:100%}
.cmd>*{min-height:0;overflow:auto}
.cuentas{display:flex;flex-direction:column;gap:8px}
.cuenta{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;display:grid;gap:6px}
.cuenta.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cuenta .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cuenta strong{font:600 18px var(--display)}
.cuenta small{color:var(--ink-2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;position:sticky;top:0;background:var(--paper);z-index:1}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;white-space:nowrap;min-height:42px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.prod{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 12px 10px;display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative}
.prod:active{transform:scale(.98)}
.prod{cursor:pointer}
.prod.sel{border:2px solid var(--olive);background:var(--olive-soft);padding:11px 11px 9px}
.prod.sel h4{padding-right:34px}
.prod .qb{position:absolute;top:8px;right:8px;min-width:28px;height:28px;padding:0 7px;border-radius:14px;background:var(--olive);color:var(--paper);font-weight:800;font-size:15px;display:grid;place-items:center}
.prod .env{font-size:12px;font-weight:700;color:var(--lav)}
.pq{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.prod .pq{width:100%}
.pq button{width:42px;height:40px;border:0;border-radius:9px;background:var(--surface-2);color:var(--ink);font-size:22px;font-weight:800;line-height:1}
.pq button:disabled{opacity:.35;cursor:default}
.pq b{min-width:28px;text-align:center;font-size:17px}
.vrows{display:grid;gap:8px}
.vsel{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 0;background:var(--paper)}
.vsel.on{border:2px solid var(--olive);background:var(--olive-soft)}
.vsel-add{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;text-align:left;border:0;background:none;padding:10px 12px;min-height:56px}
.vsel-add span{font-weight:700;font-size:16px}
.vsel-add b{font:800 18px var(--display)}
.vsel-add small{grid-column:1/-1;color:var(--lav);font-weight:700}
.vsel .pq{flex:none}
.prod h4{margin:0;font:700 15px/1.2 var(--body);text-transform:uppercase;letter-spacing:.02em}
.prod p{margin:0;font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:6px}
.prod .precio{font:800 19px var(--display);font-variant-numeric:tabular-nums}
.prod.agotado{opacity:.55}
.picor{display:inline-flex;gap:2px}.picor i{width:7px;height:7px;border-radius:50%;background:var(--line)}.picor i.on{background:var(--bad)}

.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column}
.t-head{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;gap:2px}
.t-head h3{font-size:24px}
.t-items{flex:1;overflow:auto;padding:6px 8px}
.it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.qty{display:flex;align-items:center;gap:2px}
.qty button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:18px}
.qty span{min-width:26px;text-align:center;font-weight:700}
.qfix{min-width:40px;font-weight:700;text-align:center}
.it .nm{font-weight:600}
.it .vn{color:var(--ink-2);font-weight:500}
.it .nota{font-size:13px;color:var(--warn);font-style:italic}
.it .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.it .acts{display:flex;gap:2px}
.link{border:0;background:none;color:var(--lav);font-weight:600;font-size:13px;padding:4px 6px;min-height:30px}
.link.bad{color:var(--bad)}
.t-foot{border-top:1px solid var(--line);padding:14px 16px;display:grid;gap:10px}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total b{font:800 32px var(--display);font-variant-numeric:tabular-nums}
.t-foot .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Cocina */
.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}
.kt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.kt header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);gap:8px}
.kt header strong{font:800 20px var(--display)}
.kt.warn header{background:var(--warn-soft)} .kt.late header{background:var(--bad-soft)}
.kt ul{list-style:none;margin:0;padding:6px 0}
.kt li button{width:100%;text-align:left;border:0;background:none;padding:10px 14px;display:grid;grid-template-columns:38px 1fr;gap:6px;font-size:16px}
.kt li button b{font-size:18px}
.kt li.listo button{text-decoration:line-through;color:var(--ink-2)}
.kt .nota{display:block;color:var(--warn);font-style:italic;font-size:14px}
.kt footer{padding:10px 14px;border-top:1px solid var(--line)}
.sec{margin-top:26px}
.sec h3{font-size:18px;margin-bottom:10px}
.listos{display:flex;flex-wrap:wrap;gap:10px}
.listo-card{background:var(--ok-soft);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;gap:12px}
.listo-card div{display:grid}

/* Caja / tablas */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.kpi b{font:800 28px var(--display);font-variant-numeric:tabular-nums}
.kpi small{color:var(--ink-2)}
.kpi.hero{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.kpi.hero .lbl,.kpi.hero small{color:var(--bar-2)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card h3{font-size:18px;margin-bottom:8px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.stock{font:800 20px var(--display)}
.rowacts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:44px}
.switch{width:50px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch.on{background:var(--olive)}.switch.on::after{left:23px}
.menu{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;height:100%}
.menu>*{min-height:0;overflow:auto}
.menu-cats{display:flex;flex-direction:column;gap:6px}
.mc-lbl{padding:2px 4px 4px}
.mc-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;min-height:54px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;text-align:left}
.mc-btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mc-n{min-width:28px;height:24px;padding:0 8px;border-radius:12px;background:var(--surface-2);color:var(--ink-2);font-size:13px;display:inline-grid;place-items:center}
.mc-btn.on .mc-n{background:rgba(255,255,255,.16);color:var(--paper)}
.mc-edit{margin-top:6px;color:var(--lav)}
.menu-head{position:sticky;top:0;z-index:1;background:var(--paper);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-bottom:12px}
.mh-tit{display:grid}
.mh-tit h2{font-size:26px}
#f-mbuscar{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-height:48px;width:min(320px,100%);font-size:16px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;align-items:start}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;cursor:pointer;text-align:left;min-height:150px;align-content:start}
.mcard:hover{border-color:var(--ink-2)}
.mcard:active{transform:scale(.99)}
.mcard.off{opacity:.62}
.mc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.mc-top h4{margin:0;font:700 16px/1.25 var(--body);text-transform:uppercase;letter-spacing:.02em}
.mc-precios{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px;color:var(--ink-2)}
.mc-precios b{color:var(--ink);font:800 17px var(--display)}
.mc-chips{display:flex;flex-wrap:wrap;gap:6px}
.mcard.nuevo{border:2px dashed var(--line);background:transparent;place-items:center;align-content:center;text-align:center;color:var(--ink-2);gap:4px}
.mcard.nuevo .mas{font:800 34px/1 var(--display);color:var(--olive)}
.mcard.nuevo b{color:var(--ink)}
.mcat{margin-bottom:18px}

/* Modal */
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:rgba(10,10,8,.5)}
.sheet{position:relative;background:var(--surface);border-radius:16px;padding:20px;width:min(560px,100%);max-height:calc(100% - 24px);overflow:auto;display:grid;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.sheet h2{font-size:24px}
.field{display:grid;gap:6px}
.field input,.field select,.field textarea,.mini{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;min-height:46px;width:100%;min-width:0}
.field textarea{min-height:80px;resize:vertical}
.mini{min-height:40px;padding:6px 10px}
.mact{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;position:sticky;bottom:-20px;background:var(--surface);padding-block:12px 20px;margin-bottom:-20px;border-top:1px solid var(--line)}
.mact .spacer{margin-right:auto}
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.mesa{border:1px solid var(--line);background:var(--paper);border-radius:10px;min-height:48px;font-weight:600}
.mesa.ocupada{border-style:dashed;color:var(--ink-2)}
.mesa.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vars{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.vars button{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:16px 12px;display:grid;gap:4px;text-align:center}
.vars button b{font:800 24px var(--display)}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchips button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;min-height:38px;font-size:14px}
.qchips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pago-row{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px}
.pago-row .seg{justify-self:start;max-width:100%;overflow-x:auto}
.pago-campos{display:flex;gap:6px;align-items:center}
.pago-campos .p-monto{flex:0 0 120px}
.pago-campos .p-ref{flex:1}
.caja-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.caja-head h3{margin:0}
.caja-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px;align-items:start}
.cuadre td{padding:8px 4px}
.cuadre tr.tot td{font:800 22px var(--display);border-top:2px solid var(--ink);border-bottom:0}
.cobro-total{font:800 44px var(--display);font-variant-numeric:tabular-nums;text-align:center}
.cambio{text-align:center;font-size:18px}
.cambio b{font:800 26px var(--display)}
.rows{display:grid;gap:6px}
.vrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;align-items:center}
.rrow{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr) 40px;gap:6px;align-items:center}
.cat-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.cat-row.borrar{border-color:var(--bad);background:var(--bad-soft)}
.cat-row input{flex:1;min-width:140px}
.cat-nom{flex:1;min-width:120px}
.cat-ord{display:flex;gap:4px}
.x:disabled{opacity:.3;cursor:default}
.x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:18px}
.hint{font-size:13px;color:var(--ink-2);margin:0}
.chk{display:flex;align-items:center;gap:10px;font-weight:600}
.chk input{width:22px;height:22px}

.recibo{margin:0 auto;background:#fff;color:#111;font:14px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding:18px 16px;border-radius:4px;
  box-shadow:0 1px 3px rgba(0,0,0,.18);white-space:pre;overflow-x:auto;max-width:100%;width:max-content}

<body>

<header class="top">
  <div class="brand"><i></i><b>CERVALINA</b></div>
  <nav class="tabs" id="tabs"></nav>
  <button class="impbtn" id="impbtn" data-act="ajustes"></button>
  <div class="stat"><span class="dot" id="dot"></span><span id="estado">Conectando…</span><span class="clock" id="clock"></span></div>
</header>
<main id="view"></main>
<nav class="bnav" id="bnav" aria-label="Secciones"></nav>
<div id="modal" hidden><div class="scrim" data-act="cerrar"></div><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div id="toast"></div>

<script src="vendor/firebase-app-compat.js?v=10.12.2"></script>
<script src="vendor/firebase-auth-compat.js?v=10.12.2"></script>
<script src="vendor/firebase-firestore-compat.js?v=10.12.2"></script>
<script src="config.js?v=202611190003"></script>
<script>
// En Netlify (plan gratuito) aparece su aviso flotante abajo a la derecha. En celular se deja una franja libre
// para que el aviso no tape botones de la app.
if (/\.netlify\.app$/.test(location.hostname)) document.documentElement.classList.add('con-aviso');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + (Math.round((+n||0)*100)/100).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:2});
const r3 = n => Math.round(n*1000)/1000;
const hoy = (d=new Date()) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hora = t => new Date(t).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
const mins = t => Math.max(0, Math.floor((Date.now()-t)/60000));
const uid = () => Math.random().toString(36).slice(2,9);
const folio = () => (Date.now()%1679616).toString(36).toUpperCase().padStart(4,'0');
const ls = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch{ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
const CAT_ORDER = ['Hamburguesas','Alitas','Botanas','Cervezas','Preparados','Sin alcohol'];
const UNIDADES = ['pza','kg','g','L','ml','rebanada','tira','botella','lata','bolsa'];
const NOTAS = ['Sin cebolla','Sin tomate','Sin tocino','Sin chile','Bien cocida','Extra aderezo','Salsa aparte','Para llevar'];

const S = {
  db:null, estado:'cargando', puedeEscribir:true,
  view: 'comandas', cat: ls.get('cv.cat',null), area: ls.get('cv.area','cocina'),
  cuentaSel: null, mesero: ls.get('cv.mesero',''), menuCat: ls.get('cv.mcat',null), menuBuscar:'',
  productos:{}, insumos:{}, abiertos:[], ventas:[], ventasDia: hoy(),
  loaded:{p:false,i:false,a:false}, confirm:null, soloBajos:false, pendingAdd:null
};

/* ---------- Escrituras: una a la vez por documento ---------- */
const colas = {};
function enqueue(path, fn){
  // Firestore guarda el cambio localmente al instante; sin internet la confirmación del servidor puede tardar,
  // así que la cola solo espera un momento antes de seguir con la siguiente escritura.
  const p = (colas[path] || Promise.resolve()).then(() => {
    const r = fn();
    if (r && typeof r.then==='function'){
      r.catch(e => toast(errTexto(e),'bad'));
      return Promise.race([r, new Promise(res => setTimeout(res, 700))]);
    }
    return r;
  }).catch(e => { toast(errTexto(e),'bad'); return false; });
  colas[path] = p; return p;
}
function errTexto(e){
  const c = e && e.code;
  if (c==='permission-denied') return 'Sin permiso para guardar. Cierra sesión y vuelve a entrar.';
  if (c==='resource-exhausted') return 'Se alcanzó el límite gratuito de Firebase por hoy.';
  if (c==='quota_exceeded') return 'La base de datos está llena. Borra registros antiguos.';
  if (c==='invalid_argument') return 'No tienes permiso para guardar cambios aquí.';
  if (c==='unavailable') return 'Sin conexión. Intenta de nuevo en un momento.';
  return 'No se pudo guardar' + (e && e.message ? ': '+e.message : '.');
}
function puede(){
  if (!S.db){ toast('Aún no hay conexión con la base de datos.','bad'); return false; }
  if (!S.puedeEscribir){ toast('Tu acceso es de solo lectura.','bad'); return false; }
  return true;
}
function cuentaNueva(id){
  if (S.nuevaCuenta && S.abiertos.some(x => x.id===S.nuevaCuenta.id)) S.nuevaCuenta = null;
  return S.nuevaCuenta && S.nuevaCuenta.id===id ? S.nuevaCuenta : null;
}
function mutPedido(id, f){
  return enqueue('pedidos/'+id, () => {
    const actual = S.abiertos.find(x => x.id===id) || cuentaNueva(id);
    if (!actual) return;
    const cambios = f(structuredClone(actual));
    if (!cambios) return;
    if (actual===S.nuevaCuenta) Object.assign(S.nuevaCuenta, cambios);
    return S.db.doc('pedidos/'+id).update(cambios);
  });
}
const totalDe = items => items.reduce((s,i) => s + i.precio*i.qty, 0);

/* ---------- Recetas e inventario ---------- */
function recetaDe(p, vn){
  const v = vn ? (p.vars||[]).find(x => x.n===vn) : (p.vars||[])[0];
  if (v && v.r) return {r:v.r, m:1};
  return {r:p.receta||{}, m:(v && v.m) || 1};
}
function disponibles(p){
  const {r,m} = recetaDe(p, null);
  let min = Infinity;
  for (const [iid,q] of Object.entries(r)){
    const ins = S.insumos[iid]; if (!ins || !(q>0)) continue;
    min = Math.min(min, Math.floor((ins.stock||0)/(q*m) + 1e-9));
  }
  return min;
}
// Inventario: se descuenta al entregar o al cobrar, nunca al enviar.
// inv:'pend' = enviado y aún sin descontar; inv:'ok' = ya descontado.
// Los productos enviados antes de este cambio no traen 'inv' y ya se habían descontado al enviarse.
function descontarPendientes(items){
  const por = items.filter(i => i.est==='nuevo' || i.inv==='pend');
  if (por.length) descontar(por);
  por.forEach(i => { i.inv = 'ok'; });
}
function consumoDe(items){
  const tot = {};
  for (const it of items){
    const p = S.productos[it.pid]; if (!p) continue;
    const {r,m} = recetaDe(p, it.vn);
    for (const [iid,q] of Object.entries(r)) if (+q) tot[iid] = r3((tot[iid]||0) + (+q)*m*it.qty);
  }
  return tot;
}
function aplicarConsumo(tot, signo){
  for (const [iid,q] of Object.entries(tot)){
    if (!q) continue;
    enqueue('insumos/'+iid, () => {
      const ins = S.insumos[iid]; if (!ins) return;
      return S.db.doc('insumos/'+iid).update({stock: r3((ins.stock||0) + signo*q)});
    });
  }
}
function descontar(items){ aplicarConsumo(consumoDe(items), -1); }
const costoDe = tot => r2(Object.entries(tot).reduce((s,[iid,q]) => s + q*((S.insumos[iid] && +S.insumos[iid].costo) || 0), 0));

/* ---------- Mermas ---------- */
const MOTIVOS_MERMA = ['Se cayó','Se quemó','Caducó','Mal estado','Error de preparación','Pedido cancelado','Cortesía'];
let unsubMermas = null;
function subMermas(db){
  if (unsubMermas) unsubMermas();
  S.mermasDia = hoy(); S.mermas = [];
  unsubMermas = db.collection('mermas').where('dia','==',S.mermasDia).onSnapshot(s => {
    S.mermas = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => b.t-a.t); if (S.view==='insumos') render();
  }, () => {});
}
function registrarMerma(consumo, desc, motivo, quien){
  aplicarConsumo(consumo, -1);
  const ref = S.db.collection('mermas').doc();
  return enqueue('mermas/'+ref.id, () => ref.set({dia:hoy(), t:Date.now(), desc, consumo, motivo, quien:quien||'', costo:costoDe(consumo)}));
}
function preguntarMerma(items, motivo){
  if (!items.length) return;
  M = {mermaItems:items, motivo};
  openModal(`<span class="lbl">Merma</span><h2>¿Ya se había preparado?</h2>
    <p class="hint" style="margin:0">Si cocina o barra ya lo preparó, regístralo como merma para que salga del inventario. Si no se preparó, toca “No se preparó”.</p>
    <div class="rows">${items.map((i,ix) => `<label class="chk"><input type="checkbox" class="m-it" data-ix="${ix}" checked> ${i.qty}× ${esc(i.nombre)}${i.vn?' · '+esc(i.vn):''}</label>`).join('')}</div>
    <div class="mact"><button class="btn" data-act="cerrar">No se preparó</button><button class="btn danger armed" data-act="mermaProdOk">Registrar merma</button></div>`);
}
function modalMerma(iid){
  const lista = Object.values(S.insumos).sort((a,b) => a.nombre.localeCompare(b.nombre));
  if (!lista.length){ toast('Primero agrega insumos.','bad'); return; }

function setHTML(el, html){

  el.innerHTML = html; el._h = html;

/* ---------- Caja y ventas ---------- */
function cuadre(){
  const cob = S.ventas.filter(p => p.estado==='cobrada').sort((a,b) => b.cobrado-a.cobrado);
  const total = cob.reduce((s,p) => s+(p.total||0), 0);
  const met = {efectivo:0, tarjeta:0, transferencia:0};
  let prop = 0, propNoEf = 0;
  cob.forEach(p => {
    const ps = pagosDe(p), pr = +(p.pago?.propina)||0, suma = ps.reduce((s,x) => s+(+x.monto||0), 0);
    ps.forEach(x => { met[x.metodo] = (met[x.metodo]||0) + (+x.monto||0); if (x.metodo!=='efectivo' && suma) propNoEf += pr*(+x.monto||0)/suma; });
    prop += pr;
  });
  const c = S.caja || {}, movs = Array.isArray(c.movs) ? c.movs.slice().sort((a,b) => a.t-b.t) : [];
  const ing = r2(movs.filter(m => m.tipo==='ingreso').reduce((s,m) => s+(+m.monto||0), 0));
  const ret = r2(movs.filter(m => m.tipo==='retiro').reduce((s,m) => s+(+m.monto||0), 0));
  const fondo = +c.fondo || 0;
  return {cob, total, met, prop, propNoEf, cobrado: met.efectivo+met.tarjeta+met.transferencia,
          fondo, movs, ing, ret, esperado: r2(fondo + met.efectivo + ing - ret), cierre: c.cierre || null};
}

      <div class="kpi"><span class="lbl">Propinas</span><b>${money(prop)}</b><small>${propNoEf>0.009 ? money(propNoEf)+' por tarjeta o transferencia' : 'todas en efectivo'}</small></div>
      ${esHoy?`<div class="kpi"><span class="lbl">Cuentas abiertas</span><b>${money(abiertas)}</b><small>${S.abiertos.length} por cobrar</small></div>`:''}
    </div>

        <button class="btn sm primary" data-act="cajaCierre">${cierre?'Volver a contar':'Cerrar caja'}</button><button class="btn sm" data-act="ticketCorte">Ticket de corte</button></div></div>

          <tr><td>Fondo inicial${fondo?'':' <span class="pill p-warn">Sin registrar</span>'}</td><td class="r">${money(fondo)}</td></tr>

function balancear(editado){
  const n = M.pagos.length; if (n<2 && editado!=null) return;
  const objetivo = n===1 ? 0 : n===2 ? (editado==null ? 1 : 1-editado) : (editado===n-1 ? null : n-1);
  if (objetivo==null) return;
  const otros = M.pagos.reduce((s,p,ix) => ix===objetivo ? s : s+(+p.monto||0), 0);
  M.pagos[objetivo].monto = r2(Math.max(0, aPagar() - otros));
  const inp = document.querySelector(`.p-monto[data-ix="${objetivo}"]`); if (inp) inp.value = M.pagos[objetivo].monto;
}
function actualizarCambio(){
  const el = $('#m-cambio'); if (!el) return;
  $('#m-apagar').textContent = money(aPagar());
  $('#m-desglose').textContent = M.propina ? `Consumo ${money(M.total)} + propina ${money(M.propina)}` : 'Consumo sin propina';
  const dif = r2(aPagar() - M.pagos.reduce((s,p) => s+(+p.monto||0), 0));
  const ef = M.pagos.filter(p => p.metodo==='efectivo').reduce((s,p) => s+(+p.monto||0), 0);
  const rec = parseFloat(M.recibido) || 0;
  if (dif > 0.009) el.innerHTML = `Falta asignar <b class="num" style="color:var(--bad)">${money(dif)}</b>`;
  else if (dif < -0.009) el.innerHTML = `Los montos se pasan por <b class="num" style="color:var(--bad)">${money(-dif)}</b>`;
  else if (ef>0 && rec) el.innerHTML = rec>=ef ? `Cambio: <b class="num">${money(rec-ef)}</b>` : `Faltan <b class="num" style="color:var(--bad)">${money(ef-rec)}</b> de efectivo`;
  else el.innerHTML = ef>0 ? `Efectivo a cobrar: <b class="num">${money(ef)}</b>` : 'Montos completos';
}

function leerProducto(){
  const p = M.d, sh = $('#sheet');
  p.nombre = $('#f-nombre').value.trim(); const sc = $('#f-cat').value; p.cat = (sc==='__nueva' ? $('#f-catnueva').value.trim() : sc) || 'Otros'; p.area = $('#f-area').value;
  p.precio = parseFloat($('#f-precio').value) || 0; p.desc = $('#f-desc').value.trim(); p.activo = $('#f-activo').checked;
  const pic = $('#f-picor').value; if (pic==='') delete p.picor; else p.picor = Math.max(0, Math.min(5, parseInt(pic)||0));
  p.vars = [...sh.querySelectorAll('.vrow')].map(row => {
    const old = (p.vars||[])[+row.dataset.ix] || {};
    const v = {n: row.querySelector('.v-n').value.trim(), p: parseFloat(row.querySelector('.v-p').value)||0, m: parseFloat(row.querySelector('.v-m').value)||1};
    if (old.r) v.r = old.r;
    return v;
  });
  const receta = {};
  sh.querySelectorAll('.rrow').forEach(row => { const iid = row.querySelector('.r-i').value, q = parseFloat(row.querySelector('.r-q').value)||0; if (iid) receta[iid] = r3((receta[iid]||0) + q); });
  p.receta = receta;
}

function lineasTicket(p, pre){
  const W = 32;
  const c = s => { s = String(s); return ' '.repeat(Math.max(0, Math.floor((W - s.length)/2))) + s; };
  const lr = (l, r) => { l = String(l); r = String(r); return l + ' '.repeat(Math.max(1, W - l.length - r.length)) + r; };
  const sep = '-'.repeat(W);
  const d = new Date(pre ? Date.now() : (p.cobrado || Date.now()));
  const fecha = d.toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' + d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  const L = [c('CERVALINA'), c('Oaxaca · @cervalinaoaxaca'), sep, c(pre ? 'CUENTA' : 'TICKET DE PAGO'), '',
    lr('Folio:', '#'+p.folio), lr('Fecha:', fecha), lr('Mesa:', p.mesa)];
  if (p.mesero) L.push(lr('Atendió:', p.mesero));
  L.push(sep, lr('Cant Producto', 'Importe'), sep);
  const grupos = [];
  p.items.forEach(i => {
    const g = grupos.find(x => x.nombre===i.nombre && x.vn===(i.vn||'') && x.precio===i.precio);
    if (g) g.qty += i.qty; else grupos.push({nombre:i.nombre, vn:i.vn||'', precio:i.precio, qty:i.qty});
  });
  grupos.forEach(g => {
    const izq = String(g.qty).padStart(3) + ' ' + g.nombre, imp = money(g.qty*g.precio);
    if (izq.length + imp.length + 1 <= W) L.push(lr(izq, imp));
    else { L.push(izq.slice(0, W)); L.push(lr('', imp)); }
    if (g.vn) L.push('     ' + g.vn.slice(0, W-5));
    if (g.qty > 1) L.push('     ' + g.qty + ' x ' + money(g.precio));
  });
  const nArt = grupos.reduce((s,g) => s+g.qty, 0);
  L.push(sep, nArt + (nArt===1?' artículo':' artículos'));
  const prop = !pre && p.pago ? (+p.pago.propina||0) : 0;
  if (prop){ L.push(lr('Subtotal', money(p.total)), lr('Propina', money(prop))); }
  L.push(lr('TOTAL', money(p.total + prop)));
  if (!pre && p.pago){
    const ps = pagosDe(p);
    L.push('');
    if (ps.length===1) L.push(lr('Forma de pago:', MET_LBL[ps[0].metodo]||ps[0].metodo));
    else { L.push('Pago mixto:'); ps.forEach(x => L.push(lr('  '+(MET_LBL[x.metodo]||x.metodo), money(x.monto)))); }
    ps.forEach(x => { if (x.ref) L.push(lr('  Ref. ' + (ps.length>1 ? (MET_LBL[x.metodo]||'') : ''), String(x.ref).slice(0,16))); });
    if (ps.some(x => x.metodo==='efectivo')){ L.push(lr('Efectivo recibido:', money(p.pago.recibido))); L.push(lr('Cambio:', money(p.pago.cambio||0))); }
  }
  if (pre){ L.push('', lr('Propina sugerida 10%:', money(Math.round(p.total*.1))), lr('Propina sugerida 15%:', money(Math.round(p.total*.15)))); }
  L.push(sep);
  L.push(c('¡Gracias por su visita!'), c('No es comprobante fiscal'));
  return L;
}

  M = {id:p.id, lineas: lineasTicket(p, pre), nombre: (pre ? 'cuenta-' : 'ticket-') + p.folio, auto: pre && IMP.auto && !!IMP.ch};

function ticketPNG(lineas){
  const esc2 = 2, fs = 22, lh = 32, pad = 28;
  const cv = document.createElement('canvas'), cx = cv.getContext('2d');
  const font = `${fs}px ui-monospace, Menlo, Consolas, "Courier New", monospace`;
  cx.font = font;
  const w = Math.ceil(Math.max(...lineas.map(l => cx.measureText(l).width))) + pad*2;
  cv.width = w*esc2; cv.height = (lineas.length*lh + pad*2)*esc2;
  cx.scale(esc2, esc2);
  cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, w, lineas.length*lh + pad*2);
  cx.fillStyle = '#111111'; cx.textBaseline = 'top';
  lineas.forEach((l, ix) => { cx.font = (ix===0 || /TOTAL/.test(l)) ? 'bold '+font : font; cx.fillText(l, pad, pad + ix*lh + 4); });
  return new Promise(r => cv.toBlob(r, 'image/png'));
}

function lineasCorte(){

  firebase.auth().onAuthStateChanged(u => {
    if (u){ S.usuario = u.email || ''; if (S.estado==='login') S.estado = 'cargando'; arrancar(fs); }
    else { S.estado = 'login'; render(); }
  });
  addEventListener('online', () => { if (S.estado==='offline'){ S.estado = 'ok'; render(); } });
  addEventListener('offline', () => { S.estado = 'offline'; render(); });
  reconectarImpresora();
}
function arrancar(db){
  if (S.db) return;
  S.db = db;
  const timer = setTimeout(() => { if (S.estado==='cargando'){ S.estado = navigator.onLine ? 'lento' : 'offline'; render(); } }, 10000);
  const listo = (k, snap) => { if (!snap.metadata.fromCache) S.loaded[k] = true; if (S.loaded.p && S.loaded.i && S.loaded.a){ clearTimeout(timer); if (S.estado!=='error') S.estado = navigator.onLine ? 'ok' : 'offline'; } };
  const fallo = e => { clearTimeout(timer); S.estado = 'error'; render(); if (e && e.code==='permission-denied') toast('Sin permiso para leer los datos. Revisa las reglas de Firestore.','bad'); };
  const META = {includeMetadataChanges:true};
  db.collection('productos').onSnapshot(META, s => { const o = {}; s.docs.forEach(d => o[d.id] = {id:d.id, ...d.data()}); S.productos = o; listo('p', s); render(); }, fallo);
  db.collection('insumos').onSnapshot(META, s => { const o = {}; s.docs.forEach(d => o[d.id] = {id:d.id, ...d.data()}); S.insumos = o; listo('i', s); render(); }, fallo);
  subCategorias(db);
  subMermas(db);
  db.collection('pedidos').where('abierto','==',true).onSnapshot(META, s => {
    S.abiertos = s.docs.map(d => { const x = d.data(); return {id:d.id, ...x, items: Array.isArray(x.items) ? x.items : []}; });
    listo('a', s); render();
  }, fallo);
  subVentas();
}

/* ---------- Impresora Bluetooth (ESC/POS) ---------- */
const IMP = {dev:null, ch:null, nombre: ls.get('cv.imp',''), estado:'desconectada', auto: ls.get('cv.autoimp', true), autoPago: ls.get('cv.autopago', false)};
const BT_SERVICIOS = ['000018f0-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455',
  '0000ff00-0000-1000-8000-00805f9b34fb','0000fee7-0000-1000-8000-00805f9b34fb','0000ae30-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb'];
async function conectarImpresora(dev){
  if (!navigator.bluetooth) throw new Error('Este navegador no tiene Bluetooth. Abre la app en Chrome para Android.');
  if (!dev) dev = await navigator.bluetooth.requestDevice({acceptAllDevices:true, optionalServices:BT_SERVICIOS});
  IMP.estado = 'conectando'; render();
  try {
    const server = await dev.gatt.connect();
    let ch = null;
    for (const uuid of BT_SERVICIOS){
      try {
        const sv = await server.getPrimaryService(uuid);
        for (const c of await sv.getCharacteristics()) if (c.properties.write || c.properties.writeWithoutResponse){ ch = c; break; }
      } catch {}
      if (ch) break;
    }
    if (!ch){ dev.gatt.disconnect(); throw new Error('La impresora no ofrece un canal de impresión compatible.'); }
    if (!IMP.dev || IMP.dev!==dev) dev.addEventListener('gattserverdisconnected', () => { IMP.ch = null; IMP.estado = 'desconectada'; render(); });
    IMP.dev = dev; IMP.ch = ch; IMP.nombre = dev.name || 'Impresora'; ls.set('cv.imp', IMP.nombre);
    IMP.estado = 'conectada'; render();
  } catch (e) { IMP.estado = 'desconectada'; render(); throw e; }
}
async function reconectarImpresora(){
  if (!navigator.bluetooth || !navigator.bluetooth.getDevices || !IMP.nombre) return;
  try {
    const ds = await navigator.bluetooth.getDevices();
    const d = ds.find(x => x.name===IMP.nombre) || ds[0];
    if (d) await conectarImpresora(d);
  } catch {}
}
const CP437 = {'á':0xA0,'é':0x82,'í':0xA1,'ó':0xA2,'ú':0xA3,'ñ':0xA4,'Ñ':0xA5,'ü':0x81,'Ü':0x9A,'É':0x90,'¿':0xA8,'¡':0xAD,'·':0xFA,'°':0xF8,
  'Á':0x41,'Í':0x49,'Ó':0x4F,'Ú':0x55,'−':0x2D,'×':0x78,'“':0x22,'”':0x22};
const enc = str => { const o = []; for (const ch of str){ const c = ch.charCodeAt(0); o.push(c<128 ? c : (CP437[ch] ?? 0x3F)); } return o; };
function escpos(lineas){
  const b = [0x1B,0x40, 0x1B,0x74,0x00];
  lineas.forEach((l, ix) => {
    if (ix===0){ b.push(0x1B,0x61,0x01, 0x1D,0x21,0x11, ...enc(l.trim()), 0x0A, 0x1D,0x21,0x00, 0x1B,0x61,0x00); return; }
    const fuerte = /^TOTAL\s/.test(l) || /^= Esperado/.test(l);
    if (fuerte) b.push(0x1B,0x45,0x01, 0x1D,0x21,0x01);
    b.push(...enc(l), 0x0A);
    if (fuerte) b.push(0x1D,0x21,0x00, 0x1B,0x45,0x00);
  });
  b.push(0x1B,0x64,0x04, 0x1D,0x56,0x42,0x00);
  return new Uint8Array(b);
}
async function enviarBytes(bytes, n){
  const ch = IMP.ch, sinResp = ch.properties.writeWithoutResponse && ch.writeValueWithoutResponse;
  for (let i = 0; i < bytes.length; i += n){
    const parte = bytes.slice(i, i+n);
    if (sinResp){ await ch.writeValueWithoutResponse(parte); await new Promise(r => setTimeout(r, 25)); }
    else await (ch.writeValueWithResponse ? ch.writeValueWithResponse(parte) : ch.writeValue(parte));
  }
}
async function imprimir(lineas){
  try {
    if (!IMP.ch){
      if (IMP.dev) await conectarImpresora(IMP.dev);
      else { toast('Conecta la impresora con el botón de arriba.','bad'); return false; }
    }
    const bytes = escpos(lineas);
    try { await enviarBytes(bytes, 100); } catch { await enviarBytes(bytes, 20); }
    toast('Imprimiendo…'); return true;
  } catch (e) {
    toast('No se pudo imprimir: ' + (e && e.message ? e.message : 'revisa que la impresora esté encendida.'), 'bad'); return false;
  }
}
function modalAjustes(){
  const bt = !!navigator.bluetooth;
  openModal(`<h2>Impresora y sesión</h2>
    <div class="card" style="display:grid;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <div><span class="lbl">Impresora</span><br><b>${IMP.estado==='conectada' ? esc(IMP.nombre) : 'Sin conectar'}</b></div>
        ${IMP.estado==='conectada' ? `<button class="btn sm" data-act="impDesconectar">Desconectar</button>` : `<button class="btn sm primary" data-act="impConectar" ${bt?'':'disabled'}>Buscar impresora</button>`}
      </div>
      ${bt ? '' : `<p class="hint" style="margin:0;color:var(--bad)">Este navegador no permite Bluetooth. Abre la app en Chrome para Android.</p>`}
      <label class="chk"><input type="checkbox" id="f-autoimp" ${IMP.auto?'checked':''}> Imprimir la cuenta automáticamente al tocar “Cobrar”</label>
      <label class="chk"><input type="checkbox" id="f-autopago" ${IMP.autoPago?'checked':''}> Imprimir también el ticket de pago al registrar el pago</label>
      <button class="btn" data-act="impPrueba" ${IMP.estado==='conectada'?'':'disabled'}>Imprimir prueba</button>
    </div>
    <p class="hint">Si tu impresora no aparece al buscar, solo es compatible con Bluetooth clásico. En ese caso usa el botón “Menú de impresión” de cada ticket con la app RawBT.</p>
    <div class="mact"><span class="hint spacer">${esc(S.usuario||'')}</span><button class="btn danger" data-act="logout">Cerrar sesión</button><button class="btn primary" data-act="cerrar">Listo</button></div>`);
}
async function cargarCarta(){
  if (!puede()) return;
  try {
    const seed = await (await fetch('seed.json', {cache:'no-store'})).json();
    const batch = S.db.batch();
    for (const [col, docs] of Object.entries(seed)) for (const [id, data] of Object.entries(docs)) batch.set(S.db.collection(col).doc(id), data);
    await batch.commit(); toast('Carta e insumos cargados');
  } catch (e) { toast('No se pudo cargar la carta: ' + (e.message||e), 'bad'); }
}
function tick(){ $('#clock').textContent = new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); if (S.db && S.mermasDia && S.mermasDia!==hoy()) subMermas(S.db); }
tick(); setInterval(() => { tick(); render(); }, 30000);
init();
</script>
